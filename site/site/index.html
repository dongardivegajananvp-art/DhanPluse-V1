<title>Opening DhanPulse…</title>
<style>body{font:16px system-ui,sans-serif;background:#0b1020;color:#e8edf7;display:grid;min-height:100vh;place-items:center;margin:0}main{max-width:32rem;padding:2rem;text-align:center}a{color:#7ee7d4}</style>

<body>
<main>
<h1>Opening DhanPulse…</h1>
<p>Returning to the main workspace and preserving any FYERS sign-in response.</p>
<p><a id="continue" href="../">Continue to DhanPulse</a></p>
</main>
<script>
(function () {
  var target = new URL('../', window.location.href);
  target.search = window.location.search;
  target.hash = window.location.hash;
  document.getElementById('continue').href = target.toString();
  window.location.replace(target.toString());
})();
</script>
