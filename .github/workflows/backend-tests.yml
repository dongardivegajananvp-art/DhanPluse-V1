name: Validate DhanPulse backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gv2vpd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gv2vpd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gv2vpd_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Run backend regression and PostgreSQL integration tests
        working-directory: backend
        run: npm test
