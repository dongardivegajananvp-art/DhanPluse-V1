name: Validate DhanPulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/journal.js
          node --check site/risk-calculator.js
          node --check site/backtest.js
          node --check backend/src/server.js
          node --check backend/src/gap-analysis.js
          node --check backend/src/movers-validation.js
          node --check backend/src/fresh-data-validation.js
          node --check backend/src/cors-origin-policy.js
          node --check scripts/check-tabs.mjs
          node --check scripts/check-oauth-offline.mjs
          node --check scripts/check-deployed-cors.mjs
          node --check site/sw.js
      - name: Validate PWA manifest and required assets
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('./site/manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1); console.log('PWA manifest valid')"
          test -s site/index.html
          test -s site/style.css
          test -s site/app.js
          test -s site/journal.js
          test -s site/risk-calculator.js
          test -s site/backtest.js
          grep -q 'risk-calculator.js' site/index.html
          grep -q 'backtest.js' site/index.html
          test -s site/sw.js
          test -s site/dhanpulse-icon.svg
          node scripts/check-tabs.mjs
          node scripts/check-preview-isolation.mjs
          node scripts/check-oauth-offline.mjs
          grep -q 'BSE:SENSEX-INDEX' backend/src/server.js
          grep -q 'Order placement' site/index.html
          grep -q 'publish = "site"' netlify.toml
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run backend unit tests
        working-directory: backend
        run: npm test
      - name: Verify backend dependency graph
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Verify deployed test-backend CORS (PR #42 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 42
        env:
          DHANPULSE_TEST_BACKEND: https://dhanpulse-clean-test.onrender.com
          DHANPULSE_PREVIEW_ORIGIN: https://deploy-preview-42--spectacular-gaufre-b5c029.netlify.app
        run: node scripts/check-deployed-cors.mjs
