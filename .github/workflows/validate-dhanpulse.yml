name: Validate DhanPulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/journal.js
          node --check site/risk-calculator.js
          node --check site/backtest.js
          node --check backend/src/server.js
          node --check backend/src/gap-analysis.js
          node --check backend/src/movers-validation.js
          node --check backend/src/fresh-data-validation.js
          node --check backend/src/cors-origin-policy.js
          node --check scripts/check-tabs.mjs
          node --check scripts/check-oauth-offline.mjs
          node --check scripts/check-deployed-cors.mjs
          node --check site/sw.js
          echo "Checking embedded JavaScript in the original /site/ app shell."
          node scripts/check-inline-scripts.mjs
      - name: Validate PWA manifest and required assets
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('./site/manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1); console.log('PWA manifest valid')"
          test -s site/index.html
          test -s site/style.css
          test -s site/app.js
          ! grep -q 'journal.js' site/index.html
          ! grep -q 'risk-calculator.js' site/index.html
          ! grep -q 'backtest.js' site/index.html
          test -s site/sw.js
          test -s site/gv2vpd-icon.svg
          node scripts/check-tabs.mjs
          node scripts/check-preview-isolation.mjs
          node scripts/check-oauth-offline.mjs
          grep -q 'BSE:SENSEX-INDEX' backend/src/server.js
          grep -q 'Order placement' site/index.html
          grep -q 'publish = "site"' netlify.toml
      - name: GV2VPD PR preview desktop and mobile browser smoke
        if: github.event_name == 'pull_request'
        env:
          GV2VPD_PREVIEW_URL: http://127.0.0.1:4173/site/
          PLAYWRIGHT_MODULE: /tmp/gv2vpd-playwright/node_modules/playwright
        run: |
          python3 -m http.server 4173 --directory . >/tmp/gv2vpd-preview.log 2>&1 &
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:4173/site/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/site/ >/dev/null
          mkdir -p /tmp/gv2vpd-playwright
          npm install --prefix /tmp/gv2vpd-playwright --no-audit --no-fund playwright
          /tmp/gv2vpd-playwright/node_modules/.bin/playwright install chromium
          node scripts/check-gv2vpd-browser.cjs
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run backend unit tests
        working-directory: backend
        run: npm test
      - name: Verify backend dependency graph
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Report full dependency audit details
        working-directory: backend
        continue-on-error: true
        run: |
          npm audit --json > /tmp/dhanpulse-full-audit.json || audit_status=$?
          node --input-type=commonjs -e 'const fs=require("node:fs"); const p="/tmp/dhanpulse-full-audit.json"; if(!fs.existsSync(p)){console.log("Full audit report unavailable; npm audit command did not produce JSON."); process.exit(0)} const a=JSON.parse(fs.readFileSync(p,"utf8")); console.log("Full dependency audit totals:",JSON.stringify(a.metadata?.vulnerabilities||{})); for(const [name,v] of Object.entries(a.vulnerabilities||{})){console.log(JSON.stringify({package:name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})}))}'
          echo "Full audit command exit code: ${audit_status:-0} (diagnostic only; production audit remains enforced above)."
      - name: Verify production backend health and CORS
        env:
          BACKEND_URL: https://dhanpluse-v1.onrender.com
          PRODUCTION_ORIGIN: https://dongardivegajananvp-art.github.io
        run: |
          set -euo pipefail
          health=""
          health_http_code="000"
          health_probe_meta="not-run"
          health_curl_exit="0"
          for attempt in $(seq 1 6); do
            health_stderr="$(mktemp)"
            health_file="$(mktemp)"
            health_curl_exit=0
            health_probe_meta="$(curl --silent --show-error --max-time 60 --output "$health_file" --write-out 'http=%{http_code} dns_s=%{time_namelookup} connect_s=%{time_connect} tls_s=%{time_appconnect} total_s=%{time_total} remote_ip=%{remote_ip}' "${BACKEND_URL}/health" 2>"$health_stderr")" || health_curl_exit=$?
            health_http_code="${health_probe_meta#http=}"
            health_http_code="${health_http_code%% *}"
            health="$(cat "$health_file")"
            if [[ "$health_curl_exit" -eq 0 && "$health_http_code" =~ ^2[0-9][0-9]$ ]] && node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1)' "$health" 2>/dev/null; then
              rm -f "$health_stderr" "$health_file"
              break
            fi
            echo "::warning::Production /health probe attempt $attempt/6 failed: curl_exit=$health_curl_exit $health_probe_meta"
            if [[ -s "$health_stderr" ]]; then
              sed -E 's#(https?://)[^/@ ]+:[^/@ ]+@#\1[redacted]@#g' "$health_stderr"
            fi
            if [[ -n "$health" ]]; then
              node -e 'try { const h=JSON.parse(process.argv[1]); console.log("Health response fields:", JSON.stringify({ok:h.ok,serviceHealth:h.serviceHealth,fyersConfigured:h.fyersConfigured,orderPlacementEnabled:h.orderPlacementEnabled})); } catch { console.log("Health response was non-JSON; body omitted."); }' "$health"
            fi
            rm -f "$health_stderr" "$health_file"
            health=""
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          if [[ -z "$health" ]]; then
            echo "::error::Production backend /health did not pass. Last probe: curl_exit=$health_curl_exit $health_probe_meta. See preceding diagnostics; health gate remains enforced."
            exit 1
          fi
          node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1); console.log("PASS: original backend healthy, FYERS configured, order placement disabled. Live tick fields: connected="+h.liveDataConnected+", socket="+h.marketSocketConnected+", lastTickAt="+h.lastTickAt)' "$health"
          curl --fail --silent --show-error --max-time 60 -D /tmp/dhanpulse-allowed-headers.txt -o /tmp/dhanpulse-status.json -H "Origin: ${PRODUCTION_ORIGIN}" -H "Accept: application/json" "${BACKEND_URL}/api/status"
          grep -Eiq "^access-control-allow-origin: ${PRODUCTION_ORIGIN}" /tmp/dhanpulse-allowed-headers.txt
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/dhanpulse-status.json","utf8")); if(s.backend!=="online" || s.orderPlacement!=="disabled") process.exit(1); console.log("PASS: production /api/status returns online and read-only state.")'
          preflight_status="$(curl --silent --show-error --max-time 60 -D /tmp/dhanpulse-preflight-headers.txt -o /dev/null -w "%{http_code}" -X OPTIONS -H "Origin: ${PRODUCTION_ORIGIN}" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,content-type" "${BACKEND_URL}/api/status")"
          if [[ "$preflight_status" != "204" && "$preflight_status" != "200" ]]; then
            echo "::error::Production CORS preflight failed (HTTP ${preflight_status})."
            exit 1
          fi
          grep -Eiq "^access-control-allow-origin: ${PRODUCTION_ORIGIN}" /tmp/dhanpulse-preflight-headers.txt
          grep -Eiq "^access-control-allow-methods:.*GET" /tmp/dhanpulse-preflight-headers.txt
          grep -Eiq "^access-control-allow-headers:.*authorization" /tmp/dhanpulse-preflight-headers.txt
          denied_status="$(curl --silent --show-error --max-time 60 -D /tmp/dhanpulse-denied-headers.txt -o /tmp/dhanpulse-denied.json -w "%{http_code}" -H "Origin: https://untrusted.example" -H "Accept: application/json" "${BACKEND_URL}/api/status")"
          if [[ "$denied_status" != "403" ]] || grep -Eiq "^access-control-allow-origin:" /tmp/dhanpulse-denied-headers.txt; then
            echo "::error::Production CORS did not reject an unrelated origin (HTTP ${denied_status})."
            exit 1
          fi
          echo "PASS: original Pages origin allowed, preflight accepted, unrelated origin rejected."
      - name: Verify deployed test-backend CORS (PR #42 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 42
        env:
          DHANPULSE_TEST_BACKEND: https://dhanpulse-clean-test.onrender.com
          DHANPULSE_PREVIEW_ORIGINS: https://deploy-preview-42--spectacular-gaufre-b5c029.netlify.app,https://dhanpulse-clean-test-ui.onrender.com
        run: node scripts/check-deployed-cors.mjs
