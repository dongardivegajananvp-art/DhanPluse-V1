name: Keep Render Free Backend Warm

on:
  schedule:
    # Render Free web services spin down after 15 minutes without inbound traffic.
    # A 10-minute health request reduces cold starts without changing backend data.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-free-backend-keepalive
  cancel-in-progress: false

jobs:
  ping-production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the original production backend health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://dhanpluse-v1.onrender.com/health"
          for attempt in 1 2 3 4; do
            response="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 "$url" 2>/dev/null || true)"
            if grep -q '"serviceHealth":"HEALTHY"' <<< "$response"; then
              printf '%s\n' "$response"
              echo "PASS: original Render backend returned a healthy HTTP response."
              exit 0
            fi
            echo "Backend is waking up or did not return its health JSON (attempt $attempt/4)."
            sleep 10
          done
          echo "::error::The original Render backend did not return its expected HEALTHY JSON response."
          exit 1
