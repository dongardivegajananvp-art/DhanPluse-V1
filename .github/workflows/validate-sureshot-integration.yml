name: Validate Sureshot integration

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/validate-sureshot-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check changed backend JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/sureshot-request-priority.js
      - name: Run complete backend unit and route-contract suite
        run: npm test
