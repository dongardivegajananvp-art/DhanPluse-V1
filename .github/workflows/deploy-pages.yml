name: Deploy DhanPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "index.html"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the original URL layout
        run: |
          set -euo pipefail
          mkdir -p dist/site
          cp index.html dist/index.html
          cp -R site/. dist/site/
          test -s dist/index.html
          test -s dist/site/index.html
          grep -q "site/" dist/index.html
          grep -q "Sureshot CE/PE" dist/site/index.html
          grep -q "dhanpulse-shell-v129-bold-workstation-theme-v1" dist/site/sw.js
          grep -q "app.js?v=20261105-exchange-live-switches-v1" dist/site/index.html
          grep -q "SURESHOT_AUTO_SCAN_ATTEMPT_KEY" dist/site/app.js
      - name: Package static site for Pages
        run: |
          set -euo pipefail
          tar --dereference --hard-dereference --directory dist -cvf "${RUNNER_TEMP}/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload uniquely named Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published original /site/ URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          app_url="${PAGE_URL%/}/site/"
          html=""
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}?deploy_smoke=$(date +%s)" 2>/dev/null || true)"
            if [[ -n "$html" ]] && grep -q "Sureshot CE/PE" <<< "$html" && grep -q "style.css?v=20261105-bold-workstation-theme-v1" <<< "$html" && grep -q "app.js?v=20261105-exchange-live-switches-v1" <<< "$html"; then
              break
            fi
            echo "Waiting for the deployed Pages asset to become visible (attempt $attempt/12)."
            sleep 10
          done
          if [[ -z "$html" ]] || ! grep -q "Sureshot CE/PE" <<< "$html" || ! grep -q "style.css?v=20261105-bold-workstation-theme-v1" <<< "$html"; then
            echo "::error::The original /site/ URL did not serve the expected DhanPulse UI build."
            exit 1
          fi
          sw="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}sw.js?deploy_smoke=$(date +%s)")"
          grep -q "dhanpulse-shell-v129-bold-workstation-theme-v1" <<< "$sw"
          app_js="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}app.js?v=20261105-exchange-live-switches-v1&deploy_smoke=$(date +%s)")"
          grep -q "SURESHOT_AUTO_SCAN_ATTEMPT_KEY" <<< "$app_js"
          grep -q "settingsMcxFeed" <<< "$app_js"
          grep -q 'style.css?v=20261105-bold-workstation-theme-v1' <<< "$index_html"
          grep -q "settingsNseSession" <<< "$app_js"
          grep -q "settingsNseLiveFeed" <<< "$app_js"
          grep -q "settingsMcxSession" <<< "$app_js"
          grep -q "settingsMcxLiveFeed" <<< "$app_js"
          grep -q "startAutomaticTopFiveScan();" <<< "$app_js"
          grep -q "FYERS Connection" <<< "$html"
          echo "PASS: ${app_url} serves the two-tab DhanPulse UI and service-worker cache build."
          backtest="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}backtest.js?v=20261027-fno-gap-selector2&deploy_smoke=$(date +%s)")"
          grep -q "Sureshot CE/PE" <<< "$html"
          echo "PASS: original /site/ serves Sureshot and FYERS Connection tabs."
      - name: Two-tab Sureshot and FYERS connection browser smoke test
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dhanpulse-playwright
          cd /tmp/dhanpulse-playwright
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          cat > ui-smoke.cjs <<'NODE'
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.clock.install({ time: new Date('2026-11-05T04:00:00.000Z') }); // 09:30 IST, regular NSE session
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            // Keep the smoke test deterministic even when production FYERS has a real cooldown.
            await page.route('**/api/status', async route => route.fulfill({
              status: 200, contentType: 'application/json',
              body: JSON.stringify({ backend: 'online', fyers: 'not-connected', liveData: 'waiting-for-live-ticks',
                marketSocketConnected: false, exchangeLiveStatus: { NSE: { session: 'SCHEDULED_OPEN', sessionHours: '09:15–15:30 IST', feed: 'WAITING' }, MCX: { session: 'SCHEDULED_OPEN', sessionHours: '09:00–23:55 IST (non-agri)', feed: 'WAITING' } }, mcxDiagnostic: { exchange: 'MCX', status: 'WAITING_FOR_EXCHANGE_TICK', symbol: 'MCX:CRUDEOIL26NOVFUT', ltp: null, exchangeTimestamp: null, signalsAllowed: false }, fyersDataApi: { cooldownActive: false, retryAfterSeconds: 0 }, orderPlacement: 'disabled' })
            }));
            const appUrl = process.env.APP_URL.replace(/\/$/, '') + '/site/';
            const response = await page.goto(appUrl + '?browser_smoke=' + Date.now(), { waitUntil: 'networkidle', timeout: 60000 });
            if (!response || !response.ok()) throw new Error('Original /site/ page did not return HTTP success');
            const tabs = page.locator('#nav button[data-tab]');
            const names = await tabs.evaluateAll(items => items.map(item => item.getAttribute('data-tab')));
            if (names.length !== 2 || names[0] !== 'Sureshot CE/PE' || names[1] !== 'FYERS Connection') throw new Error('Expected exactly Sureshot and FYERS Connection tabs; found ' + names.length + ': ' + names.join(', '));
            let scanRequests = 0;
            await page.evaluate(() => { window.__scanRequests = 0; });
            await page.route('**/api/market/sureshot-auto-plans**', async route => {
              scanRequests += 1;
              await page.evaluate(count => { window.__scanRequests = count; }, scanRequests);
              await route.fulfill({ status: 429, contentType: 'application/json', body: JSON.stringify({ ok: false, error: 'Test-only controlled rate-limit response', stage: 'VERIFY_FNO_QUOTES', retryAfterSeconds: 60 }) });
            });
            await page.locator('#nav button[data-tab="Sureshot CE/PE"]').click();
            await page.waitForFunction(() => document.querySelector('#pageTitle')?.textContent?.trim() === 'Sureshot CE/PE', { timeout: 5000 });
            await page.waitForTimeout(1500);
            if (scanRequests !== 0) throw new Error('Unauthenticated Sureshot must not launch a full-universe scan.');
            await page.waitForSelector('#scanSureshotUniverseBtn', { timeout: 5000 });
            if (await page.locator('#sureshotFyersConnectBtn').count()) throw new Error('Connect control must not appear on Sureshot tab.');
            await page.locator('#nav button[data-tab="FYERS Connection"]').click();
            await page.waitForFunction(() => document.querySelector('#pageTitle')?.textContent?.trim() === 'FYERS Connection', { timeout: 5000 });
            await page.waitForSelector('#connectFyersBtn', { state: 'visible', timeout: 5000 });
            await page.waitForSelector('#testBackendBtn', { state: 'visible', timeout: 5000 });
            await page.waitForSelector('#settingsMcxFeed', { state: 'visible', timeout: 5000 });
            for (const selector of ['#settingsNseSession', '#settingsNseLiveFeed', '#settingsMcxSession', '#settingsMcxLiveFeed']) await page.waitForSelector(selector, { state: 'visible', timeout: 5000 });
            if ((await page.locator('#settingsNseSession').textContent()).trim() !== 'SCHEDULED OPEN' || (await page.locator('#settingsMcxSession').textContent()).trim() !== 'SCHEDULED OPEN') throw new Error('NSE/MCX scheduled session switches did not render independently.');
            await page.evaluate(() => localStorage.setItem('dhanpulse-dashboard-session-v1', 'smoke-session'));
            await page.locator('#nav button[data-tab="Sureshot CE/PE"]').click();
            await page.waitForSelector('#scanSureshotUniverseBtn', { timeout: 5000 });
            await page.waitForSelector('#sureshotUniverseResults', { timeout: 5000 });
            await page.waitForFunction(() => document.querySelector('#setupStatus')?.textContent?.toLowerCase()?.includes('verify fno quotes'), { timeout: 5000 });
            if (scanRequests !== 1) throw new Error('Authenticated live-session Sureshot tab did not auto-start exactly one full-universe scan.');
            await page.locator('#scanSureshotUniverseBtn').click();
            await page.waitForFunction(() => window.__scanRequests === 2, { timeout: 5000 });
            if (scanRequests !== 2) throw new Error('Manual Sureshot rescan did not issue exactly one additional controlled API request.');
            await page.waitForFunction(() => document.querySelector('#setupStatus')?.textContent?.toLowerCase()?.includes('full-universe scan withheld'), { timeout: 5000 });
            await page.clock.fastForward(31_000);
            await page.waitForTimeout(100);
            if (scanRequests !== 2) throw new Error('A failed Sureshot scan was automatically retried by the 30-second timer; the daily attempt guard did not hold.');
            if (pageErrors.length) throw new Error('Browser page errors: ' + pageErrors.join(' | '));
            console.log('PASS: exactly two tabs; unauthenticated Sureshot does not scan; authenticated 09:30 IST session auto-starts full-universe scan; manual rescan works; rate-limit is handled safely.');
            await page.close();

            // Exercise the production shell at a real Android-sized touch viewport.
            const mobile = await browser.newContext({ ...devices['Pixel 7'] });
            const mobilePage = await mobile.newPage();
            const mobileErrors = [];
            mobilePage.on('pageerror', error => mobileErrors.push(error.message));
            await mobilePage.route('**/api/status', async route => route.fulfill({
              status: 200, contentType: 'application/json',
              body: JSON.stringify({ backend: 'online', fyers: 'not-connected', liveData: 'waiting-for-live-ticks',
                marketSocketConnected: false, exchangeLiveStatus: { NSE: { session: 'SCHEDULED_OPEN', sessionHours: '09:15–15:30 IST', feed: 'WAITING' }, MCX: { session: 'SCHEDULED_OPEN', sessionHours: '09:00–23:55 IST (non-agri)', feed: 'WAITING' } }, mcxDiagnostic: { exchange: 'MCX', status: 'WAITING_FOR_EXCHANGE_TICK', symbol: 'MCX:CRUDEOIL26NOVFUT', ltp: null, exchangeTimestamp: null, signalsAllowed: false }, fyersDataApi: { cooldownActive: false, retryAfterSeconds: 0 }, orderPlacement: 'disabled' })
            }));
            const mobileResponse = await mobilePage.goto(appUrl + '?android_smoke=' + Date.now(), { waitUntil: 'networkidle', timeout: 60000 });
            if (!mobileResponse || !mobileResponse.ok()) throw new Error('Android-sized PWA page did not return HTTP success');
            const mobileTabs = mobilePage.locator('#nav button[data-tab]');
            if (await mobileTabs.count() !== 2) throw new Error('Android viewport did not render exactly two production tabs');
            if (await mobilePage.locator('link[rel="manifest"]').count() !== 1) throw new Error('PWA manifest link is missing on Android viewport');
            await mobilePage.locator('#nav button[data-tab="FYERS Connection"]').tap();
            await mobilePage.waitForSelector('#connectFyersBtn', { state: 'visible', timeout: 5000 });
            await mobilePage.waitForSelector('#settingsMcxFeed', { state: 'visible', timeout: 5000 });
            for (const selector of ['#settingsNseSession', '#settingsNseLiveFeed', '#settingsMcxSession', '#settingsMcxLiveFeed']) await mobilePage.waitForSelector(selector, { state: 'visible', timeout: 5000 });
            await mobilePage.locator('#nav button[data-tab="Sureshot CE/PE"]').tap();
            await mobilePage.waitForSelector('#scanSureshotUniverseBtn', { timeout: 5000 });
            if (mobileErrors.length) throw new Error('Android viewport page errors: ' + mobileErrors.join(' | '));
            console.log('PASS: Pixel 7 touch viewport loads PWA shell, switches both tabs, and has no uncaught browser errors.');
            await mobile.close();
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node ui-smoke.cjs
      - name: Verify production backend health and CORS
        env:
          BACKEND_URL: https://dhanpluse-v1.onrender.com
          PRODUCTION_ORIGIN: https://dongardivegajananvp-art.github.io
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 6); do
            health="$(curl --fail --silent --show-error --max-time 60 "${BACKEND_URL}/health" 2>/dev/null || true)"
            if [[ -n "$health" ]] && node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1)' "$health"; then
              break
            fi
            echo "Waiting for the production backend health endpoint (attempt $attempt/6)."
            sleep 10
          done
          if [[ -z "$health" ]]; then
            echo "::error::Production backend /health did not return a response."
            exit 1
          fi
          node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1); const age=h.lastTickAt?Date.now()-Date.parse(h.lastTickAt):Infinity; console.log("PASS: backend healthy, FYERS configured, order placement disabled. Live tick status is informational here: liveDataConnected="+h.liveDataConnected+", marketSocketConnected="+h.marketSocketConnected+", lastTickAt="+h.lastTickAt+", tickAgeMs="+age+". Missing/stale ticks remain blocked by app signal gates and are checked separately from static-site deployment.");' "$health"
          curl --fail --silent --show-error --max-time 60 -D /tmp/dhanpulse-status-headers.txt -o /tmp/dhanpulse-status.json -H "Origin: ${PRODUCTION_ORIGIN}" -H "Accept: application/json" "${BACKEND_URL}/api/status"
          grep -Eiq "^access-control-allow-origin: ${PRODUCTION_ORIGIN}" /tmp/dhanpulse-status-headers.txt
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/dhanpulse-status.json","utf8")); if(s.backend!=="online" || s.orderPlacement!=="disabled") process.exit(1); console.log("PASS: production /api/status returns backend online, order placement disabled, FYERS="+s.fyers+", liveData="+s.liveData+", lastTickAt="+s.lastTickAt)' 
          denied_status="$(curl --silent --show-error --max-time 60 -D /tmp/dhanpulse-denied-headers.txt -o /tmp/dhanpulse-denied.json -w "%{http_code}" -H "Origin: https://untrusted.example" -H "Accept: application/json" "${BACKEND_URL}/api/status")"
          if [[ "$denied_status" != "403" ]]; then
            echo "::error::Unexpected origin was not rejected by production CORS (HTTP ${denied_status})."
            exit 1
          fi
          if grep -Eiq "^access-control-allow-origin:" /tmp/dhanpulse-denied-headers.txt; then
            echo "::error::Unexpected origin received an allow-origin header."
            exit 1
          fi
          echo "PASS: production CORS allows the original Pages origin and rejects an unrelated origin."
