name: Deploy DhanPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "index.html"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the original /site/ URL with GV2VPD shell
        run: |
          set -euo pipefail
          node scripts/check-tabs.mjs
          node scripts/check-inline-scripts.mjs
          mkdir -p dist/site
          cp index.html dist/index.html
          cp -R site/. dist/site/
          test -s dist/index.html
          test -s dist/site/index.html
          test -s dist/site/gv2vpd-icon.svg
          grep -q "site/" dist/index.html
          grep -q "GV2VPD — FYERS" dist/site/index.html
          grep -q 'data-tab="Home"' dist/site/index.html
          grep -q 'data-tab="Sureshot"' dist/site/index.html
          grep -q 'data-tab="Position"' dist/site/index.html
          grep -q "gv2vpd-shell-v3-three-tab-app" dist/site/sw.js
          grep -q "GV2VPD — FYERS Workstation" dist/site/manifest.webmanifest
          grep -q "Paper Mode ledger" dist/site/index.html
          grep -q "Live BUY remains disabled" dist/site/index.html
      - name: Upload correctly packaged Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 1
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published GV2VPD original /site/ URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          app_url="${PAGE_URL%/}/site/"
          html=""
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}?deploy_smoke=$(date +%s)" 2>/dev/null || true)"
            if [[ -n "$html" ]] && grep -q "GV2VPD — FYERS" <<< "$html" && grep -q 'data-tab="Home"' <<< "$html" && grep -q 'data-tab="Sureshot"' <<< "$html" && grep -q 'data-tab="Position"' <<< "$html"; then
              break
            fi
            echo "Waiting for the published GV2VPD /site/ shell (attempt $attempt/12)."
            sleep 10
          done
          if [[ -z "$html" ]] || ! grep -q "GV2VPD — FYERS" <<< "$html" || ! grep -q 'data-tab="Home"' <<< "$html" || ! grep -q 'data-tab="Sureshot"' <<< "$html" || ! grep -q 'data-tab="Position"' <<< "$html"; then
            echo "::error::The original /site/ URL did not serve the expected GV2VPD three-tab app."
            exit 1
          fi
          sw="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}sw.js?deploy_smoke=$(date +%s)")"
          grep -q "gv2vpd-shell-v3-three-tab-app" <<< "$sw"
          manifest="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}manifest.webmanifest?deploy_smoke=$(date +%s)")"
          grep -q "GV2VPD — FYERS Workstation" <<< "$manifest"
          icon="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}gv2vpd-icon.svg?deploy_smoke=$(date +%s)")"
          grep -q "<svg" <<< "$icon"
          grep -q "Paper Mode ledger" <<< "$html"
          grep -q "Live BUY remains disabled" <<< "$html"
          echo "PASS: ${app_url} serves GV2VPD Home/Sureshot/Position, PWA manifest/icon, Paper Mode, and read-only safety labels."
      - name: GV2VPD desktop and mobile browser smoke on published Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GV2VPD_BACKEND_URL: https://dhanpluse-v1.onrender.com
          PLAYWRIGHT_MODULE: /tmp/gv2vpd-playwright/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/gv2vpd-playwright
          npm install --prefix /tmp/gv2vpd-playwright --no-audit --no-fund playwright
          /tmp/gv2vpd-playwright/node_modules/.bin/playwright install --with-deps chromium
          export GV2VPD_PREVIEW_URL="${PAGE_URL%/}/site/"
          node scripts/check-gv2vpd-browser.cjs
      - name: Verify production backend health and CORS
        env:
          BACKEND_URL: https://dhanpluse-v1.onrender.com
          PRODUCTION_ORIGIN: https://dongardivegajananvp-art.github.io
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 6); do
            health="$(curl --fail --silent --show-error --max-time 60 "${BACKEND_URL}/health" 2>/dev/null || true)"
            if [[ -n "$health" ]] && node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1)' "$health"; then
              break
            fi
            echo "Waiting for the production backend health endpoint (attempt $attempt/6)."
            sleep 10
          done
          if [[ -z "$health" ]]; then
            echo "::error::Production backend /health did not return a response."
            exit 1
          fi
          node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1); const age=h.lastTickAt?Date.now()-Date.parse(h.lastTickAt):Infinity; console.log("PASS: backend healthy, FYERS configured, order placement disabled. Live tick status is informational here: liveDataConnected="+h.liveDataConnected+", marketSocketConnected="+h.marketSocketConnected+", lastTickAt="+h.lastTickAt+", tickAgeMs="+age+". Missing/stale ticks remain blocked by app signal gates and are checked separately from static-site deployment.");' "$health"
          curl --fail --silent --show-error --max-time 60 -D /tmp/dhanpulse-status-headers.txt -o /tmp/dhanpulse-status.json -H "Origin: ${PRODUCTION_ORIGIN}" -H "Accept: application/json" "${BACKEND_URL}/api/status"
          grep -Eiq "^access-control-allow-origin: ${PRODUCTION_ORIGIN}" /tmp/dhanpulse-status-headers.txt
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/dhanpulse-status.json","utf8")); if(s.backend!=="online" || s.orderPlacement!=="disabled") process.exit(1); console.log("PASS: production /api/status returns backend online, order placement disabled, FYERS="+s.fyers+", liveData="+s.liveData+", lastTickAt="+s.lastTickAt)' 
          denied_status="$(curl --silent --show-error --max-time 60 -D /tmp/dhanpulse-denied-headers.txt -o /tmp/dhanpulse-denied.json -w "%{http_code}" -H "Origin: https://untrusted.example" -H "Accept: application/json" "${BACKEND_URL}/api/status")"
          if [[ "$denied_status" != "403" ]]; then
            echo "::error::Unexpected origin was not rejected by production CORS (HTTP ${denied_status})."
            exit 1
          fi
          if grep -Eiq "^access-control-allow-origin:" /tmp/dhanpulse-denied-headers.txt; then
            echo "::error::Unexpected origin received an allow-origin header."
            exit 1
          fi
          echo "PASS: production CORS allows the original Pages origin and rejects an unrelated origin."
