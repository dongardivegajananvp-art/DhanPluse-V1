name: Deploy DhanPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the original URL layout
        run: |
          set -euo pipefail
          mkdir -p dist/site
          cp index.html dist/index.html
          cp -R site/. dist/site/
          test -s dist/index.html
          test -s dist/site/index.html
          grep -q "site/" dist/index.html
          grep -q "UI build 2026-11-02" dist/site/index.html
          grep -q "dhanpulse-shell-v106-sureshot-next-open-retry" dist/site/sw.js
          grep -q "app.js?v=20261104-sureshot-focused-cooldown-v1" dist/site/index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published original /site/ URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          app_url="${PAGE_URL%/}/site/"
          html=""
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}?deploy_smoke=$(date +%s)" 2>/dev/null || true)"
            if [[ -n "$html" ]] && grep -q "UI build 2026-11-02" <<< "$html" && grep -q "style.css?v=20261029-restore24-v2" <<< "$html" && grep -q "app.js?v=20261104-sureshot-focused-cooldown-v1" <<< "$html"; then
              break
            fi
            echo "Waiting for the deployed Pages asset to become visible (attempt $attempt/12)."
            sleep 10
          done
          if [[ -z "$html" ]] || ! grep -q "UI build 2026-11-02" <<< "$html" || ! grep -q "style.css?v=20261029-restore24-v2" <<< "$html"; then
            echo "::error::The original /site/ URL did not serve the expected DhanPulse UI build."
            exit 1
          fi
          sw="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}sw.js?deploy_smoke=$(date +%s)")"
          grep -q "dhanpulse-shell-v106-sureshot-next-open-retry" <<< "$sw"
          echo "PASS: ${app_url} serves the expected DhanPulse UI and service-worker cache build."
          backtest="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}backtest.js?v=20261027-fno-gap-selector2&deploy_smoke=$(date +%s)")"
          grep -Fq "DMA20 crossover + SwingLow/ATR stop" <<< "$backtest"
          grep -Fq "0.35*atr14[i]" <<< "$backtest"
          echo "PASS: deployed Backtesting JavaScript includes the DMA20/SwingLow/ATR strategy."
      - name: Sureshot-only browser smoke test
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dhanpulse-playwright
          cd /tmp/dhanpulse-playwright
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          cat > ui-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            const appUrl = process.env.APP_URL.replace(/\/$/, '') + '/site/';
            const response = await page.goto(appUrl + '?browser_smoke=' + Date.now(), { waitUntil: 'networkidle', timeout: 60000 });
            if (!response || !response.ok()) throw new Error('Original /site/ page did not return HTTP success');
            const tabs = page.locator('#nav button[data-tab]');
            const names = await tabs.evaluateAll(items => items.map(item => item.getAttribute('data-tab')));
            if (names.length !== 1 || names[0] !== 'Sureshot CE/PE') throw new Error('Expected exactly one Sureshot CE/PE tab; found ' + names.length + ': ' + names.join(', '));
            await page.locator('#nav button[data-tab="Sureshot CE/PE"]').click();
            await page.waitForFunction(() => document.querySelector('#pageTitle')?.textContent?.trim() === 'Sureshot CE/PE', { timeout: 5000 });
            await page.waitForSelector('#scanSureshotUniverseBtn', { timeout: 5000 });
            await page.waitForSelector('#sureshotUniverseResults', { timeout: 5000 });
            if (pageErrors.length) throw new Error('Browser page errors: ' + pageErrors.join(' | '));
            console.log('PASS: original /site/ exposes only Sureshot CE/PE and renders its full-universe scan controls without page errors.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node ui-smoke.cjs
      - name: Verify production backend health and CORS
        env:
          BACKEND_URL: https://dhanpluse-v1.onrender.com
          PRODUCTION_ORIGIN: https://dongardivegajananvp-art.github.io
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 6); do
            health="$(curl --fail --silent --show-error --max-time 60 "${BACKEND_URL}/health" 2>/dev/null || true)"
            if [[ -n "$health" ]] && node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1)' "$health"; then
              break
            fi
            echo "Waiting for the production backend health endpoint (attempt $attempt/6)."
            sleep 10
          done
          if [[ -z "$health" ]]; then
            echo "::error::Production backend /health did not return a response."
            exit 1
          fi
          node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1); const age=h.lastTickAt?Date.now()-Date.parse(h.lastTickAt):Infinity; console.log("PASS: backend healthy, FYERS configured, order placement disabled. Live tick status is informational here: liveDataConnected="+h.liveDataConnected+", marketSocketConnected="+h.marketSocketConnected+", lastTickAt="+h.lastTickAt+", tickAgeMs="+age+". Missing/stale ticks remain blocked by app signal gates and are checked separately from static-site deployment.");' "$health"
          curl --fail --silent --show-error --max-time 60 -D /tmp/dhanpulse-status-headers.txt -o /tmp/dhanpulse-status.json -H "Origin: ${PRODUCTION_ORIGIN}" -H "Accept: application/json" "${BACKEND_URL}/api/status"
          grep -Eiq "^access-control-allow-origin: ${PRODUCTION_ORIGIN}" /tmp/dhanpulse-status-headers.txt
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/dhanpulse-status.json","utf8")); if(s.backend!=="online" || s.orderPlacement!=="disabled") process.exit(1); console.log("PASS: production /api/status returns backend online, order placement disabled, FYERS="+s.fyers+", liveData="+s.liveData+", lastTickAt="+s.lastTickAt)' 
