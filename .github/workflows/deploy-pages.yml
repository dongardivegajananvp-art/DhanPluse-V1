name: Deploy DhanPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the original URL layout
        run: |
          set -euo pipefail
          mkdir -p dist/site
          cp index.html dist/index.html
          cp -R site/. dist/site/
          test -s dist/index.html
          test -s dist/site/index.html
          grep -q "site/" dist/index.html
          grep -q "UI build 2026-10-29" dist/site/index.html
          grep -q "dhanpulse-shell-v93-restore24-detail" dist/site/sw.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published original /site/ URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          app_url="${PAGE_URL%/}/site/"
          html=""
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}?deploy_smoke=$(date +%s)" 2>/dev/null || true)"
            if [[ -n "$html" ]] && grep -q "UI build 2026-10-29" <<< "$html" && grep -q "style.css?v=20261029-restore24-v2" <<< "$html"; then
              break
            fi
            echo "Waiting for the deployed Pages asset to become visible (attempt $attempt/12)."
            sleep 10
          done
          if [[ -z "$html" ]] || ! grep -q "UI build 2026-10-29" <<< "$html" || ! grep -q "style.css?v=20261029-restore24-v2" <<< "$html"; then
            echo "::error::The original /site/ URL did not serve the expected DhanPulse UI build."
            exit 1
          fi
          sw="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}sw.js?deploy_smoke=$(date +%s)")"
          grep -q "dhanpulse-shell-v93-restore24-detail" <<< "$sw"
          echo "PASS: ${app_url} serves the expected DhanPulse UI and service-worker cache build."
          backtest="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}backtest.js?v=20261027-fno-gap-selector2&deploy_smoke=$(date +%s)")"
          grep -Fq "DMA20 crossover + SwingLow/ATR stop" <<< "$backtest"
          grep -Fq "0.35*atr14[i]" <<< "$backtest"
          echo "PASS: deployed Backtesting JavaScript includes the DMA20/SwingLow/ATR strategy."
      - name: Interactive browser smoke test for all tabs
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dhanpulse-playwright
          cd /tmp/dhanpulse-playwright
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          cat > ui-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            const appUrl = process.env.APP_URL.replace(/\/$/, '') + '/site/';
            const response = await page.goto(appUrl + '?browser_smoke=' + Date.now(), { waitUntil: 'networkidle', timeout: 60000 });
            if (!response || !response.ok()) throw new Error('Original /site/ page did not return HTTP success');
            const buttons = page.locator('#nav button[data-tab]');
            const names = await buttons.evaluateAll(items => items.map(item => item.getAttribute('data-tab')));
            if (names.length !== 24) throw new Error('Expected 24 original tabs; found ' + names.length);
            const visited = [];
            for (const name of names) {
              await page.locator('#nav button[data-tab="' + name.replace(/"/g, '\\"') + '"]').click();
              await page.waitForFunction(expected => document.querySelector('#pageTitle')?.textContent?.trim() === expected, name, { timeout: 5000 });
              visited.push(name);
              if (name === 'Backtesting') {
                await page.waitForSelector('#dpBtStrategy', { timeout: 5000 });
                const strategy = await page.locator('#dpBtStrategy option').allTextContents();
                if (!strategy.some(value => value.includes('DMA20 crossover + SwingLow/ATR stop'))) {
                  throw new Error('DMA20/SwingLow/ATR option missing in interactive Backtesting UI');
                }
              }
            }
            if (pageErrors.length) throw new Error('Browser page errors: ' + pageErrors.join(' | '));
            console.log('PASS: interactive Chromium opened original /site/, clicked all ' + visited.length + ' tabs, and found DMA20/SwingLow/ATR strategy. No uncaught page errors.');
            console.log('Visited tabs: ' + visited.join(' | '));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node ui-smoke.cjs
      - name: Verify production backend health and CORS
        env:
          BACKEND_URL: https://dhanpluse-v1.onrender.com
          PRODUCTION_ORIGIN: https://dongardivegajananvp-art.github.io
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 6); do
            health="$(curl --fail --silent --show-error --max-time 60 "${BACKEND_URL}/health" 2>/dev/null || true)"
            if [[ -n "$health" ]]; then break; fi
            echo "Waiting for the production backend (attempt $attempt/6)."
            sleep 10
          done
          if [[ -z "$health" ]]; then
            echo "::error::Production backend /health did not return a response."
            exit 1
          fi
          node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1); const now=new Date(); const ist=new Date(now.getTime()+330*60000); const day=ist.getUTCDay(); const minute=ist.getUTCHours()*60+ist.getUTCMinutes(); const inSession=day>=1&&day<=5&&minute>=555&&minute<930; const age=h.lastTickAt?Date.now()-Date.parse(h.lastTickAt):Infinity; console.log("Backend health: liveDataConnected="+h.liveDataConnected+", marketSocketConnected="+h.marketSocketConnected+", lastTickAt="+h.lastTickAt+", tickAgeMs="+age+", regularSession="+inSession+", orderPlacementEnabled="+h.orderPlacementEnabled); if(inSession&&(!h.liveDataConnected||!h.marketSocketConnected||!Number.isFinite(age)||age<0||age>15000)) { console.error("FAIL: regular-session verified exchange tick is missing, stale, or future-dated."); process.exit(1); } console.log("PASS: backend/FYERS configured and order placement disabled; "+(inSession?"fresh exchange-timestamped index snapshot verified":"outside regular session; freshness not asserted"));' "$health"
          curl --fail --silent --show-error --max-time 60 -D /tmp/dhanpulse-status-headers.txt -o /tmp/dhanpulse-status.json -H "Origin: ${PRODUCTION_ORIGIN}" -H "Accept: application/json" "${BACKEND_URL}/api/status"
          grep -Eiq "^access-control-allow-origin: ${PRODUCTION_ORIGIN}" /tmp/dhanpulse-status-headers.txt
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/dhanpulse-status.json","utf8")); if(s.backend!=="online" || s.orderPlacement!=="disabled") process.exit(1); console.log("PASS: production /api/status returns backend online, order placement disabled, FYERS="+s.fyers+", liveData="+s.liveData+", lastTickAt="+s.lastTickAt)' 
