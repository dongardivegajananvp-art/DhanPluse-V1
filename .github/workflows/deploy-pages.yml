name: Deploy DhanPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the original URL layout
        run: |
          set -euo pipefail
          mkdir -p dist/site
          cp index.html dist/index.html
          cp -R site/. dist/site/
          test -s dist/index.html
          test -s dist/site/index.html
          grep -q "site/" dist/index.html
          grep -q "UI build 2026-10-27" dist/site/index.html
          grep -q "dhanpulse-shell-v84-dma20-backtest" dist/site/sw.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published original /site/ URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          app_url="${PAGE_URL%/}/site/"
          html=""
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}?deploy_smoke=$(date +%s)" 2>/dev/null || true)"
            if [[ -n "$html" ]] && grep -q "UI build 2026-10-27" <<< "$html" && grep -q "style.css?v=20261027-ui-refresh2" <<< "$html"; then
              break
            fi
            echo "Waiting for the deployed Pages asset to become visible (attempt $attempt/12)."
            sleep 10
          done
          if [[ -z "$html" ]] || ! grep -q "UI build 2026-10-27" <<< "$html" || ! grep -q "style.css?v=20261027-ui-refresh2" <<< "$html"; then
            echo "::error::The original /site/ URL did not serve the expected DhanPulse UI build."
            exit 1
          fi
          sw="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}sw.js?deploy_smoke=$(date +%s)")"
          grep -q "dhanpulse-shell-v83-fno-universe" <<< "$sw"
          echo "PASS: ${app_url} serves the expected DhanPulse UI and service-worker cache build."
          backtest="$(curl --fail --silent --show-error --location --max-time 20 "${app_url}backtest.js?v=20261027-dma20-atr1&deploy_smoke=$(date +%s)")"
          grep -Fq "DMA20 crossover + SwingLow/ATR stop" <<< "$backtest"
          grep -Fq "ATR(14)" <<< "$backtest"
          echo "PASS: deployed Backtesting JavaScript includes the DMA20/SwingLow/ATR strategy."
      - name: Verify production backend health and CORS
        env:
          BACKEND_URL: https://dhanpluse-v1.onrender.com
          PRODUCTION_ORIGIN: https://dongardivegajananvp-art.github.io
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 6); do
            health="$(curl --fail --silent --show-error --max-time 60 "${BACKEND_URL}/health" 2>/dev/null || true)"
            if [[ -n "$health" ]]; then break; fi
            echo "Waiting for the production backend (attempt $attempt/6)."
            sleep 10
          done
          if [[ -z "$health" ]]; then
            echo "::error::Production backend /health did not return a response."
            exit 1
          fi
          node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true || h.fyersConfigured!==true || h.orderPlacementEnabled!==false) process.exit(1); console.log("PASS: backend online, FYERS environment configured, order placement disabled; liveDataConnected="+h.liveDataConnected)' "$health"
          curl --fail --silent --show-error --max-time 60 -D /tmp/dhanpulse-status-headers.txt -o /tmp/dhanpulse-status.json -H "Origin: ${PRODUCTION_ORIGIN}" -H "Accept: application/json" "${BACKEND_URL}/api/status"
          grep -Eiq "^access-control-allow-origin: ${PRODUCTION_ORIGIN}" /tmp/dhanpulse-status-headers.txt
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/dhanpulse-status.json","utf8")); if(s.backend!=="online" || s.orderPlacement!=="disabled") process.exit(1); console.log("PASS: production /api/status returns backend online, order placement disabled, FYERS="+s.fyers+", liveData="+s.liveData)' 
