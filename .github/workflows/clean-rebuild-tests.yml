name: Clean rebuild backend tests

on:
  push:
    branches: [clean-rebuild]
  pull_request:
    branches: [clean-rebuild]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check src/server.js
      - name: Check frontend syntax
        run: node --check ../frontend/app.js
      - name: Run tests
        run: npm test
