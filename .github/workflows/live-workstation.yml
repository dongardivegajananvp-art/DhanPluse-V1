name: Validate live trading workstation

on:
  push:
    branches: [main, feature/live-trading-workstation]
    paths:
      - "live-workstation/**"
      - ".github/workflows/live-workstation.yml"
  pull_request:
    paths:
      - "live-workstation/**"
      - ".github/workflows/live-workstation.yml"

permissions:
  contents: read

jobs:
  workstation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 26]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install workstation dependencies
        working-directory: live-workstation
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript syntax
        working-directory: live-workstation
        run: npm test
